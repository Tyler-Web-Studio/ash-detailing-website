<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ canonical }}">
<meta name="theme-color" content="#0A0C0F">
<meta name="robots" content="{{ robots }}">

<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site_name }}">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:image" content="{{ og_image }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="en_GB">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ title }}">
<meta name="twitter:description" content="{{ description }}">
<meta name="twitter:image" content="{{ og_image }}">

<script>document.documentElement.classList.add("js")</script>
<link rel="preload" href="/fonts/archivo-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/main.css?v={{ css_v }}">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
{{{ schema }}}
</head>
<body class="{{ body_class }}">
<a class="skip" href="#main">Skip to content</a>
{{{ preview_banner }}}

<!-- Menu state lives in CSS, not JS: mobile navigation must work even if
     main.js fails to load, otherwise the site becomes unnavigable on a phone. -->
<input type="checkbox" id="navtoggle" class="navtoggle" aria-label="Open menu">

{{> header}}

<main id="main">
{{{ body }}}
</main>

{{> footer}}
{{> mobilebar}}

<script src="/main.js?v={{ js_v }}" defer></script>
</body>
</html>
