# Netlify config for Ash's Vehicle Valet & Detailing
#
# `dist/` is committed to the repo, so Netlify has nothing to build — it just
# publishes the folder. Push to GitHub, connect the repo, done.
#
# If you'd rather Netlify ran the build itself, swap the command below for:
#     command = "pip install pillow && python3 build.py"
# It works, but it makes every deploy depend on pip resolving Pillow. Publishing
# the prebuilt folder is faster and can't fail.

[build]
  publish = "dist"
  command = "echo 'Publishing prebuilt dist/'"

# --- keep non-production deploys out of the index --------------------------
# Deploy Previews (PRs) and branch deploys are public URLs. Without this they
# can be crawled and compete with the real site. Production is untouched.
[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex, nofollow"

# --- why there are no [[headers]] blocks here ------------------------------
# Security and cache headers live in dist/_headers, generated by build.py from
# src/data/headers.json. Netlify reads that file automatically, exactly as it
# reads dist/_redirects.
#
# They are NOT in this file because netlify.toml's header parser silently
# DROPPED Content-Security-Policy and Permissions-Policy — the two values
# containing "=" and ";" — while still reporting "4 header rules processed
# without errors" and serving the other three. Verified on deploy preview #2
# across several attempts. A header you cannot verify is worse than no header,
# so all of them now come from one place that demonstrably works.
#
# The 301s from the old IONOS URLs live in dist/_redirects for the same reason
# — one source, picked up automatically. Don't duplicate either of them here.
